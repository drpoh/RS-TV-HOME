<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720,initial-scale=1"><title>RS Family Frame</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080d17;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.photo{position:absolute;left:0;top:0;width:100%;height:100%;background-position:center;background-repeat:no-repeat;background-size:contain;opacity:0;-webkit-transition:opacity .55s;transition:opacity .55s}
#video{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
#empty{position:absolute;left:0;top:0;width:100%;height:100%;text-align:center;background:#101b30;padding-top:203px}
#empty h1{font-size:56px;font-weight:400;margin:22px 0}#empty p{font-size:25px;color:#d9e6ef;line-height:1.5;margin:0 auto;width:900px}
#clock{position:absolute;top:35px;right:52px;font-size:32px;text-shadow:0 2px 8px #000}
#bar{position:absolute;bottom:0;left:0;width:100%;background:rgba(0,0,0,.67);padding:25px 42px;font-size:22px}
#count{float:right}#notice{position:absolute;bottom:112px;left:0;width:100%;text-align:center;font-size:25px;text-shadow:0 2px 8px #000}.hidden{display:none}

#bar{cursor:pointer}
#menu{position:absolute;bottom:0;left:0;width:100%;background:rgba(12,23,41,.96);padding:18px 32px 16px;z-index:6}
#menu-title{font-size:25px;font-weight:bold;margin:0 0 10px}
#actions{font-size:0}
#actions button{display:inline-block;width:24%;height:57px;vertical-align:top;margin:0 1% 8px 0;border:2px solid #6681a2;background:#2b405e;border-radius:10px;color:#fff;font:bold 19px Arial;outline:none}
#actions button:focus{border-color:#fff;background:#4c739e}
#actions button[disabled]{opacity:.38}
#actions button.warn{background:#67424a}
#menu-note{font-size:17px;color:#c7d6ec;min-height:21px}
#confirm{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.78);z-index:8;text-align:center;padding-top:160px}
#confirm-box{display:inline-block;width:75%;padding:30px;background:#22334e;border:2px solid #90a8c7;border-radius:20px}
#confirm h2{font-size:31px;margin:0 0 16px}#confirm p{font-size:23px;line-height:1.5}
#confirm button{width:220px;height:64px;margin:5px 12px;font:bold 22px Arial;color:#fff;border:2px solid #758da8;border-radius:10px;background:#345574}
#confirm button:focus{border:3px solid white;background:#547ca5}#confirm #yes{background:#783e46}
#clock,#notice,#bar{z-index:3}
#input-surface{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;outline:none;background:transparent} #clock,#notice{pointer-events:none} #video{pointer-events:none}

.remote-indicator{display:inline-block;color:#d7e5f7;font:15px Arial;white-space:nowrap;line-height:20px;vertical-align:middle}
.remote-battery{display:inline-block;vertical-align:middle;width:24px;height:12px;border:1px solid #cfdfef;border-radius:3px;padding:1px;position:relative;margin-right:4px}
.remote-battery:after{position:absolute;right:-4px;top:3px;width:2px;height:4px;background:#cfdfef;content:''}
#remote-charge-fill{display:block;height:8px;width:0;background:#a4e7c1;border-radius:1px}
#remote-charge{margin-right:7px}
.remote-signal{display:inline-block;vertical-align:middle;height:15px;margin-right:5px}
.remote-signal i{display:inline-block;width:3px;margin-right:2px;background:#6c7887;vertical-align:bottom}
.remote-signal i:nth-child(1){height:4px}.remote-signal i:nth-child(2){height:7px}.remote-signal i:nth-child(3){height:10px}.remote-signal i:nth-child(4){height:14px}
.bars-1 i:first-child,.bars-2 i:nth-child(-n+2),.bars-3 i:nth-child(-n+3),.bars-4 i{background:#a4e7c1}
.remote-indicator.offline #remote-state{color:#ffb0a8}
#remote-indicator{position:absolute;left:35px;top:34px;z-index:4;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.5);pointer-events:none}
</style></head>
<body><div id="p0" class="photo"></div><div id="p1" class="photo"></div><video tabindex="-1" id="video" class="hidden" preload="auto"></video><div id="empty"><h1>Семейная фоторамка</h1><p id="message">Подключение к домашнему альбому...</p></div><div id="input-surface" tabindex="-1" aria-label="Управление фоторамкой"></div><div id="remote-indicator" class="remote-indicator offline"><span class="remote-battery"><span id="remote-charge-fill"></span></span><span id="remote-charge">—%</span><span id="remote-signal" class="remote-signal bars-0"><i></i><i></i><i></i><i></i></span><span id="remote-state">Пульт</span></div><div id="clock"></div><div id="notice"></div><div id="bar" role="button">← → Назад / далее　 OK Пауза　 ↑ ↓ Меню　 BACK Выход <span id="count"></span></div>
<div id="menu" class="hidden"><div id="menu-title">Управление фоторамкой · 1.2.3</div><div id="actions"></div><div id="menu-note"></div></div><div id="confirm" class="hidden"><div id="confirm-box"><h2>Удалить из показа?</h2><p>Оригинал останется на диске. Файл можно вернуть.</p><button id="no">Отмена</button><button id="yes">Удалить из показа</button></div></div><script src="player.js"></script><script src="remote-indicator.js"></script></body></html>
