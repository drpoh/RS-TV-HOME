<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RS Family Frame</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4ff;font:16px Arial,sans-serif;padding:24px}main{max-width:520px;margin:22px auto}h1{font-size:29px;margin:0 0 8px}p{color:#c4d0e2;line-height:1.5}.panel{background:#1c2940;border:1px solid #384b66;border-radius:20px;padding:22px;margin-top:25px}label{display:block;margin:0 0 9px;font-weight:600}input,button{width:100%;min-height:48px;border:1px solid #536984;border-radius:10px;padding:12px;font-size:16px;margin-bottom:18px}input{color:#fff;background:#111c2d}button{background:#a8dbcc;color:#102820;font-weight:bold;border:0}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%;height:16px}small{color:#b7c5d7}</style></head><body><main><h1>RS Family Frame</h1><p>Добавьте фотографии в домашний альбом телевизора.</p><div class="panel"><form id="form"><label for="key">PIN-код</label><input id="key" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required placeholder="4 цифры"><label for="files">Фотографии</label><input id="files" type="file" accept="image/jpeg,image/png" multiple required><button id="start">Загрузить фотографии</button></form><progress id="progress" value="0" max="1"></progress><p id="status" role="status">Выберите JPEG или PNG. До 12 МБ на файл.</p><small>Только домашняя сеть. Снимки автоматически уменьшаются до Full HD; оригиналы остаются на телефоне. Не используйте пароль Home Assistant.</small></div></main><script>
(function(){var f=document.getElementById('form'),s=document.getElementById('status'),p=document.getElementById('progress'),b=document.getElementById('start');f.addEventListener('submit',async function(e){e.preventDefault();var key=document.getElementById('key').value,files=Array.from(document.getElementById('files').files);if(!files.length)return;b.disabled=true;p.max=files.length;p.value=0;var ok=0,fail=0;try{for(var i=0;i<files.length;i++){var item=files[i];s.textContent='Загрузка '+(i+1)+' из '+files.length+'…';if(item.size>12582912){fail++;p.value=i+1;continue;}try{var r=await fetch('/api/upload',{method:'POST',headers:{'X-Album-Key':key,'Content-Type':'application/octet-stream'},body:item});if(r.status===401||r.status===429||r.status===503){s.textContent=r.status===401?'Неверный PIN.':r.status===429?'Слишком много попыток. Попробуйте позже.':'Сначала настройте PIN на Raspberry Pi.';return;}if(r.ok)ok++;else fail++;}catch(err){fail++;}p.value=i+1;}s.textContent='Загружено: '+ok+'. Не загружено: '+fail+'. Фото появятся на телевизоре после обновления альбома.';}finally{b.disabled=false;document.getElementById('key').value='';}});})();
</script></body></html>
