<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RS TV Home — настройки</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#111827;color:#edf3ff;font:17px system-ui,sans-serif}main{max-width:520px;margin:auto}h1{font-size:26px}h2{font-size:19px;margin:22px 0 10px}p{color:#b5c5df;line-height:1.45}section{background:#202e48;border-radius:16px;padding:15px;margin:14px 0}button,input,select{font:inherit;color:inherit;background:#324565;border:1px solid #576b8a;border-radius:10px;padding:10px}button{cursor:pointer}input{width:100%}.primary{width:100%;margin-top:12px;background:#3668a1;font-weight:600}.line{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #35445c}.line span{flex:1}.line button{min-width:42px}.check{width:auto;accent-color:#56a8f4}.status{min-height:24px;color:#a9d7ff}select{width:100%}button:disabled{opacity:.45}#editor[hidden]{display:none}
</style><main><h1>RS TV Home</h1><p>Настройки телевизора · только домашняя сеть</p>
<section><label for="pin">Код с экрана телевизора</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button class="primary" id="login">Подключиться</button></section><div class="status" id="status" role="status"></div>
<div id="editor" hidden><section><h2>Цветовая тема</h2><select id="theme"><option value="blue">Синяя</option><option value="violet">Фиолетовая</option><option value="forest">Зелёная</option><option value="graphite">Графит</option></select></section><section><h2>Порядок приложений</h2><div id="apps"></div></section><section><h2>Карточки умного дома</h2><div id="widgets"></div></section><button class="primary" id="save">Сохранить на телевизоре</button><button class="primary" id="reload">Обновить настройки</button></div></main>
<script>
const $=id=>document.getElementById(id),names={"es.ottplayer.widget":"OTT Player","youtube.leanback.v4":"YouTube","coffee_power":"Кофемашина","com.rs.familyframe":"Фоторамка","com.webos.app.browser":"Браузер","com.webos.app.miracast":"Screen Share"},widgets={outdoor:"На улице",indoor:"В доме",sauna:"Сауна",price:"Цена электричества",camera:"Камера",chart:"График цен"};
let revision=0,pref=null,code="",busy=false;
function status(s){$("status").textContent=s}
async function send(op,extra={}){const r=await fetch("/phone",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({op,key:code,...extra}),cache:"no-store"});if(r.status===403)throw Error("Неверный код");if(r.status===429)throw Error("Слишком много попыток. Повтори через пять минут.");if(r.status===409)throw Error("Настройки уже изменены на телевизоре. Нажми «Обновить настройки».");if(!r.ok)throw Error("Не удалось подключиться");return r.json()}
function render(){ $("editor").hidden=false;$("theme").value=pref.theme;$("apps").replaceChildren();
 pref.order.forEach((id,i)=>{const row=document.createElement("div");row.className="line";const label=document.createElement("span");label.textContent=names[id];row.append(label);for(const [d,t] of [[-1,"↑"],[1,"↓"]]){const b=document.createElement("button");b.textContent=t;b.disabled=i+d<0||i+d>=pref.order.length;b.onclick=()=>{[pref.order[i],pref.order[i+d]]=[pref.order[i+d],pref.order[i]];render()};row.append(b)}$("apps").append(row)});
 $("widgets").replaceChildren();Object.entries(widgets).forEach(([id,n])=>{const row=document.createElement("label"),t=document.createElement("span"),c=document.createElement("input");row.className="line";t.textContent=n;c.type="checkbox";c.className="check";c.checked=!pref.hidden.includes(id);c.onchange=()=>{pref.hidden=pref.hidden.filter(x=>x!==id);if(!c.checked)pref.hidden.push(id)};row.append(t,c);$("widgets").append(row)})}
$("theme").onchange=()=>{if(pref)pref.theme=$("theme").value};
async function load(){if(busy)return;busy=true;try{const d=await send("read");revision=d.revision;pref=d.preferences||{theme:"blue",order:Object.keys(names),hidden:[]};render();status("Подключено")}catch(e){status(e.message)}finally{busy=false}}
$("login").onclick=()=>{code=$("pin").value.trim();$("pin").value="";load()};$("reload").onclick=load;
$("save").onclick=async()=>{if(busy||!pref)return;busy=true;try{const d=await send("write",{revision,preferences:pref});revision=d.revision;pref=d.preferences;render();status("Сохранено. Телевизор обновится автоматически.")}catch(e){status(e.message)}finally{busy=false}};
</script></html>
